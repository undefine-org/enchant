<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORA · Zellige mood board</title>
<style>
@font-face{font-family:'DM Sans';src:url(../../storyboard/fonts/DMSans.ttf)}
:root{--paper:#FAFAF7;--sheet:#F1EFE9;--ink:#151A24;--muted:#5A6375;--line:#DEDBD2;--coral:#D9533F;--night:#121C30;--cream:#FBEACE}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 'DM Sans',sans-serif}
main{max-width:1500px;margin:auto;padding:28px 36px 80px}
.top{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px;font-size:11px;letter-spacing:.12em;color:var(--muted)}
h1{font-size:clamp(40px,5vw,72px);font-weight:500;letter-spacing:-.035em;margin:24px 0 8px}
.lead{font-size:18px;color:var(--muted);margin:0 0 28px}
.palette{display:flex;gap:4px;margin:6px 0 34px}.palette div{flex:1;height:64px;border-radius:3px;display:flex;align-items:flex-end;padding:6px;font-size:11px;color:#fff;text-shadow:0 1px 2px #0008}
.palette div.light{color:#151A24;text-shadow:none}
section{border-top:1px solid var(--line);padding-top:18px;margin-top:40px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:14px}.head h2{font-size:26px;font-weight:500;margin:0;letter-spacing:-.02em}
.head .film{font-size:12px;color:var(--coral);letter-spacing:.06em}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;align-items:start}
.ph{background:var(--sheet);border-radius:4px;overflow:hidden;cursor:zoom-in}.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.ph .sw{display:flex;height:12px}.ph .sw i{display:block;height:100%}
.ph .cr{font-size:10.5px;color:var(--muted);padding:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ours{border:2px solid var(--coral);background:var(--night)}.ours img{aspect-ratio:16/9}.ours .cr{color:var(--cream)}
.lb{position:fixed;inset:0;background:#0C1322f0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9;cursor:zoom-out;padding:30px}
.lb.on{display:flex}.lb img{max-width:100%;max-height:86vh;border-radius:4px}.lb p{color:var(--cream);font-size:13px;margin:12px 0 0;text-align:center}.lb a{color:var(--cream)}
.credits{font-size:11px;color:var(--muted);columns:2;margin-top:12px}.credits div{break-inside:avoid;margin-bottom:4px}.credits a{color:inherit}
@media(max-width:700px){main{padding:18px}.credits{columns:1}}
</style></head><body><main>
<div class="top"><span>ORA VENTURES · ZELLIGE · MOOD BOARD</span><span>23 openly licensed photos · Wikimedia Commons</span></div>
<h1>Real zellige</h1><p class="lead">What the film takes from the craft: one piece, one drawing, one centre, one pattern, built to last.</p>
<div class="palette" id="palette"></div>
<div id="groups"></div>
<section><div class="head"><h2>Credits</h2></div><div class="credits" id="credits"></div></section>
</main>
<div class="lb" id="lb"><img id="lbimg" alt=""><p id="lbcap"></p></div>
<script type="module">
const $=id=>document.getElementById(id);
const rows=await (await fetch('sources.json')).json();const byFile=Object.fromEntries(rows.map(r=>[r.file,r]));
// The film palette: measured glazes from these photos, plus ORA coral kept for ORA alone.
const film=[['White glaze','#ece8e0',1],['Cement joint','#cbc6bc',1],['Honey','#c7a552',0],['Green','#5f8c63',0],['Cobalt','#3d5a9e',0],['Black','#151414',0],['ORA coral','#D9533F',0]];
$('palette').innerHTML=film.map(([n,c,l])=>`<div class="${l?'light':''}" style="background:${c}">${n}</div>`).join('');
const groups=[
 ['One piece in your hand','You already work with agents.',['z05.jpg','z22.jpg'],'../film/evidence/frame-0.png'],
 ['Drawn once, laid face down','Your way of working becomes the pattern.',['z04.jpg','z16.jpg','z23.jpg','z18.jpg','z21.jpg'],'../film/evidence/frame-900.png'],
 ['Grows from one centre','Now the whole company shares it.',['z00.jpg','z09.jpg','z14.jpg','z12.jpg'],'../film/evidence/frame-1290.png'],
 ['Star and cross','The pattern in the film',['z07.jpg','z19.jpg','z20.jpg','z08.jpg','z02.jpg'],'../film/evidence/frame-1650.png'],
 ['Built to last','Built to last. Yours to keep.',['z06.jpg','z15.jpg','z17.jpg','z01.jpg','z11.jpg','z10.jpg','z13.jpg'],'../film/evidence/frame-2100.png']];
const credit=r=>`#${parseInt(r.file.slice(1))} · ${r.title.replace('File:','')} · ${r.artist||'unknown'} · ${r.license}`;
for(const [title,line,files,ours] of groups){const s=document.createElement('section');
 s.innerHTML=`<div class="head"><h2>${title}</h2><span class="film">IN THE FILM · “${line}”</span></div><div class="row"></div>`;
 const row=s.querySelector('.row');
 for(const f of files){const r=byFile[f];const d=document.createElement('div');d.className='ph';
  d.innerHTML=`<img src="photos/${f}" alt="${r.description.replace(/"/g,'')}" loading="lazy"><div class="sw">${r.palette.map(p=>`<i style="background:${p.hex};flex:${p.share}"></i>`).join('')}</div><div class="cr">${credit(r)}</div>`;
  d.onclick=()=>{$('lbimg').src='photos/'+f;$('lbcap').innerHTML=`${credit(r)} · <a href="${r.page}" target="_blank" rel="noopener">source</a>`;$('lb').classList.add('on')};row.append(d)}
 const o=document.createElement('div');o.className='ph ours';o.innerHTML=`<img src="${ours}" alt="Film frame"><div class="cr">ORA film frame</div>`;
 o.onclick=()=>{$('lbimg').src=ours;$('lbcap').textContent='ORA film frame';$('lb').classList.add('on')};row.append(o);$('groups').append(s)}
$('credits').innerHTML=rows.filter(r=>r.file!=='z03.jpg').map(r=>`<div><a href="${r.page}">${r.title.replace('File:','')}</a> — ${r.artist||'unknown'} — <a href="${r.license_url||r.page}">${r.license}</a></div>`).join('');
$('lb').onclick=()=>$('lb').classList.remove('on');window.moodReady=true;
</script></body></html>

[package]
name = "enchant-oxiz-worker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
eetf = "=0.12.0"
libloading = "=0.8.9"
num-bigint = "0.4"
# Keep rational std support explicit, matching the qualified solver build.
num-rational = "0.4"
num-traits = "0.2"
oxiz-core = { version = "=0.3.4", default-features = false, features = ["std"] }
oxiz-solver = { version = "=0.3.4", default-features = false, features = ["std"] }

[profile.dev]
debug = 0

[profile.release]
debug = 0


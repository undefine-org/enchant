<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The living postcard</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#24253b;color:#f1ebd9;font:15px system-ui}main{max-width:1480px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font:400 27px Georgia;margin:4px 0}header p{color:#c5c0b3}section{display:grid;grid-template-columns:minmax(480px,1fr) 360px;gap:28px;align-items:start}.stage{position:relative}.stage img{display:block;width:100%;aspect-ratio:1;background:#eee8d7}.stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}aside{background:#303147;padding:20px;border-radius:8px}label{display:block;margin:12px 0 5px;color:#d4d0c6;font-size:13px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:9px;border:1px solid #737085;background:#24253b;color:#f1ebd9;border-radius:4px}textarea{resize:vertical;min-height:66px}button{border:0;border-radius:4px;padding:8px 12px;background:#ece3cf;color:#24253b;cursor:pointer}.buttons{display:flex;gap:8px;margin:12px 0}.buttons input{flex:1;width:auto}.card{border-top:1px solid #5d5a6e;padding-top:8px;margin-top:18px}.card .buttons button{font-size:12px;padding:5px 8px}pre{font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto}.status{min-height:40px;color:#d7cc9a;font-size:13px}.error{color:#ffb1a1}small{font-size:11px;overflow-wrap:anywhere;color:#b7b2a5}.inline{display:flex;gap:8px}.inline>div{flex:1}@media(max-width:900px){section{grid-template-columns:1fr}.stage{max-width:720px}main{padding:14px}}
</style>
<main><header><div><h1>The living postcard</h1><p>Change the words. Find a rhythm. Make it yours.</p></div><span id="pending"></span></header>
<section><div><div class="stage"><img id="frame" alt="Your living postcard"><svg id="overlay" viewBox="0 0 1080 1080"></svg></div>
<div class="buttons"><button id="back">←</button><button id="play">Play</button><button id="next">→</button><input id="seek" aria-label="Seek frame" type="range" min="0" max="143" value="60"></div>
<div id="status" class="status"></div><small id="revision"></small>
<div class="buttons"><button id="export">Export this postcard</button><a id="download" hidden style="color:#ece3cf">Download MP4</a></div><div id="exportStatus" class="status"></div>
<details><summary>Inspect the picture</summary><label for="object">Object</label><select id="object"></select><label><input id="showBounds" type="checkbox" style="width:auto"> Show bounds and anchors</label><pre id="inspection"></pre></details></div>
<aside><label for="title">Title</label><input id="title"><label for="subtitle">Opening sentence</label><textarea id="subtitle"></textarea>
<div class="inline"><div><label for="theme">Style</label><select id="theme"><option value="warm">Warm paper</option><option value="blueprint">Blueprint</option></select></div><div><label for="seed">Paper seed</label><input id="seed" type="number" min="0" max="99999"></div></div>
<div class="inline"><div><label for="cue">Entrance cue (seconds)</label><input id="cue" type="number" min="0" max="4" step="0.1"></div><div><label for="step">Stagger spacing</label><input id="step" type="number" min="0" max="1" step="0.05"></div></div>
<div id="cards"></div><div class="buttons"><button id="add">Add a card</button><button id="reset">Reset</button></div></aside></section></main>
<script>
const $=id=>document.getElementById(id);let config,objects={},desired=60,busy=false,dirty=false,intent=0,playing=false,origin=0,startFrame=0,timer,accepted,exportTimer,closed=false;
function drawCards(){const root=$('cards');root.replaceChildren();config.cards.forEach((card,i)=>{const box=document.createElement('div');box.className='card';const label=document.createElement('label');label.textContent=`Card ${i+1}`;const title=document.createElement('input');title.value=card.title;title.setAttribute('aria-label',`Card ${i+1} heading`);title.oninput=()=>{card.title=title.value;changed()};const body=document.createElement('textarea');body.value=card.body;body.setAttribute('aria-label',`Card ${i+1} body`);body.oninput=()=>{card.body=body.value;changed()};const buttons=document.createElement('div');buttons.className='buttons';for(const [name,action] of [['Up',()=>{if(i)[config.cards[i-1],config.cards[i]]=[card,config.cards[i-1]]}],['Down',()=>{if(i<config.cards.length-1)[config.cards[i+1],config.cards[i]]=[card,config.cards[i+1]]}],['Remove',()=>{if(config.cards.length>1)config.cards.splice(i,1)}]]){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{action();drawCards();changed()};buttons.append(b)}box.append(label,title,body,buttons);root.append(box)})}
function populate(){for(const id of ['title','subtitle','theme','seed','cue','step'])$(id).value=config[id];drawCards()}
function changed(){playing=false;$('play').textContent='Play';intent++;clearTimeout(timer);timer=setTimeout(()=>{dirty=true;drain()},180)}
function seek(k){playing=false;$('play').textContent='Play';intent++;desired=Math.max(0,Math.min(143,k));$('seek').value=desired;dirty=true;drain()}
async function drain(){if(busy||!dirty||!config)return;busy=true;dirty=false;const generation=intent,k=desired,body=JSON.stringify({config,frame:k});$('pending').textContent='Making your picture…';try{const response=await fetch('/api/frame',{method:'POST',headers:{'Content-Type':'application/json'},body});const result=await response.json();if(generation===intent){if(!result.ok){$('status').textContent=result.diagnostic||'The studio is busy; the last valid picture is retained.';$('status').className='status error'}else{const image=new Image();image.src=result.image;await image.decode();if(generation===intent){$('frame').src=result.image;accepted={revision:result.revision,config:JSON.parse(body).config};objects=result.objects;$('status').textContent=`Frame ${result.frame} · ${result.time.toFixed(3)}s / 6s`;$('status').className='status';$('revision').textContent=`Revision ${result.revision}`;const selected=$('object').value;$('object').replaceChildren(...Object.keys(objects).map(id=>{const o=document.createElement('option');o.value=o.textContent=id;return o}));if(objects[selected])$('object').value=selected;inspect()}}}}catch(error){$('status').textContent=`${error.message}; keeping the last valid picture`;$('status').className='status error'}finally{busy=false;$('pending').textContent='';if(dirty)drain()}}
function inspect(){const node=objects[$('object').value];$('inspection').textContent=node?JSON.stringify(node,null,2):'';const svg=$('overlay');svg.replaceChildren();if(!$('showBounds').checked||!node)return;for(const [key,color] of [['logical','#e75145'],['ink','#25a48e'],['effect','#b07bdb']]){const [x,y,w,h]=node[key],r=document.createElementNS('http://www.w3.org/2000/svg','rect');for(const [k,v] of Object.entries({x,y,width:w,height:h,fill:'none',stroke:color,'stroke-width':2,'stroke-dasharray':'5 4'}))r.setAttribute(k,v);svg.append(r)}for(const p of Object.values(node.anchors)){const c=document.createElementNS('http://www.w3.org/2000/svg','circle');for(const [k,v]of Object.entries({cx:p[0],cy:p[1],r:4,fill:'#e75145'}))c.setAttribute(k,v);svg.append(c)}}
for(const id of ['title','subtitle','theme','seed','cue','step'])$(id).oninput=()=>{config[id]=['seed','cue','step'].includes(id)?+$(id).value:$(id).value;changed()};$('add').onclick=()=>{if(config.cards.length<4){config.cards.push({id:`card-${Date.now()}`,title:'A new idea.',body:'Give it a little room to grow.'});drawCards();changed()}};$('reset').onclick=init;$('seek').oninput=e=>seek(+e.target.value);$('back').onclick=()=>seek(desired-1);$('next').onclick=()=>seek(desired+1);$('object').onchange=$('showBounds').onchange=inspect;
$('play').onclick=()=>{playing=!playing;origin=performance.now();startFrame=desired;$('play').textContent=playing?'Pause':'Play'};
function tick(now){if(playing){const k=Math.min(143,startFrame+Math.floor((now-origin)*24/1000));if(k!==desired){desired=k;$('seek').value=k;dirty=true;drain()}if(k===143){playing=false;$('play').textContent='Play'}}requestAnimationFrame(tick)}
function showExport(job){$('exportStatus').textContent=`Export ${job.state} · ${job.revision.slice(0,12)}${job.state==='rendering'?' · making 144 high-quality frames':''}`;if(job.state==='ready'){$('download').href=job.url;$('download').hidden=false;$('export').disabled=false}else if(job.state==='failed'){$('exportStatus').textContent=job.diagnostic;$('export').disabled=false}}
async function pollExport(revision){if(closed)return;try{const result=await(await fetch(`/api/export?revision=${encodeURIComponent(revision)}`)).json();if(!result.ok)throw new Error(result.diagnostic);showExport(result.job);if(!['ready','failed'].includes(result.job.state))exportTimer=setTimeout(()=>pollExport(revision),1500)}catch(error){$('exportStatus').textContent=error.message;$('export').disabled=false}}
$('export').onclick=async()=>{if(!accepted||busy||dirty||JSON.stringify(config)!==JSON.stringify(accepted.config)){$('exportStatus').textContent='Wait for a valid preview of this edit before exporting.';return}$('export').disabled=true;$('download').hidden=true;clearTimeout(exportTimer);try{const result=await(await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(accepted)})).json();if(!result.ok)throw new Error(result.diagnostic||'Export is busy');showExport(result.job);if(!['ready','failed'].includes(result.job.state))exportTimer=setTimeout(()=>pollExport(result.job.revision),1500)}catch(error){$('exportStatus').textContent=error.message;$('export').disabled=false}};
async function init(){playing=false;intent++;config=await(await fetch('/api/config')).json();populate();desired=60;$('seek').value=60;dirty=true;drain()}init();requestAnimationFrame(tick);addEventListener('pagehide',()=>{closed=true;clearTimeout(exportTimer);playing=false;dirty=false;intent++});
</script>

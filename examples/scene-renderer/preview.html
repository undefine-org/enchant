<!doctype html><meta charset="utf-8"><title>BL Scene Studies</title>
<style>
body{margin:0;background:#183b42;color:#f4efdf;font:16px system-ui}main{max-width:1000px;margin:36px auto;padding:24px}h1{font-weight:500}#frame{width:100%;aspect-ratio:800/450;background:#dce8de;border-radius:14px;display:block}nav{display:flex;gap:12px;align-items:center;margin:20px 0;flex-wrap:wrap}button,input{font:inherit}button{padding:8px 14px;border:0;border-radius:6px;cursor:pointer}input[type=range]{flex:1}code{overflow-wrap:anywhere;font-size:12px}#error{color:#ffc38a}#number{width:80px}
</style>
<main><h1>Scene Studies <small>— authored in Beam Lisp</small></h1>
<img id="frame" alt="BL-authored scene frame">
<nav><button id="back">←</button><button id="play">Play</button><button id="next">→</button><input id="seek" aria-label="Seek frame" type="range" min="0" value="0"><input id="number" aria-label="Frame number" type="number" min="0" value="0"><span id="clock"></span></nav>
<nav id="scenes"></nav><p>Revision <code id="revision">loading</code></p><p id="error" role="status"></p><details><summary>Scene values</summary><a id="inspect">Inspect evaluated objects at 1 second</a></details></main>
<script>
const $=id=>document.getElementById(id);
let editError="",refreshing=false;
let manifest,requested=0,serial=0,active=false,origin=0,originFrame=0;
// One in-flight image, one coalesced latest request. No unbounded decode queue.
let busy=false,pending=null;
function request(k){if(!manifest)return;requested=Math.max(0,Math.min(manifest.frames-1,Math.trunc(k)));$('seek').value=$('number').value=requested;const ticket=++serial;pending={m:manifest,k:requested,ticket};drain()}
function drain(){if(busy||!pending)return;busy=true;const {m,k,ticket}=pending;pending=null;const image=new Image();image.onload=()=>{if(ticket===serial&&m===manifest){$('frame').src=image.src;$('clock').textContent=`${(k*m.fps[1]/m.fps[0]).toFixed(3)}s / ${m.duration}s`;$('revision').textContent=m.revision;$('error').textContent=editError}busy=false;drain()};image.onerror=()=>{if(ticket===serial)$('error').textContent='Frame unavailable; retaining last valid image';busy=false;drain()};image.src=`${m.revision}/${k}.png`}
async function refresh(){if(refreshing)return;refreshing=true;try{const status=await fetch('status.json',{cache:'no-store'});if(status.ok){const state=await status.json();editError=state.ok?'':state.diagnostic;$('error').textContent=editError}const r=await fetch('manifest.json',{cache:'no-store'});if(!r.ok)throw Error(`Manifest: ${r.status}`);const m=await r.json();if(!manifest||m.revision!==manifest.revision){manifest=m;$('seek').max=$('number').max=m.frames-1;$('inspect').href=`${m.revision}/scene.json`;$('scenes').replaceChildren(...m.scenes.map((k,i)=>{const b=document.createElement('button');b.textContent=`Scene ${i+1}`;b.onclick=()=>seek(k);return b}));seek(requested)}}catch(e){$('error').textContent=`${e.message}; retaining last valid revision`}finally{refreshing=false}}
function seek(k){active=false;$('play').textContent='Play';request(k)}
$('seek').oninput=e=>seek(+e.target.value);$('number').onchange=e=>seek(+e.target.value);$('back').onclick=()=>seek(requested-1);$('next').onclick=()=>seek(requested+1);
$('play').onclick=()=>{active=!active;origin=performance.now();originFrame=requested;$('play').textContent=active?'Pause':'Play'};
function tick(now){if(active&&manifest){const k=originFrame+Math.floor((now-origin)*manifest.fps[0]/manifest.fps[1]/1000);if(k>=manifest.frames){seek(manifest.frames-1)}else if(k!==requested)request(k)}requestAnimationFrame(tick)}
addEventListener('pagehide',()=>{active=false;pending=null;serial++});refresh();setInterval(refresh,1000);requestAnimationFrame(tick);
</script>

name: Configure the Nix build backend
description: Select local KVM, existing Nix configuration, or nixbuild.net without changing recipes
inputs:
  backend:
    description: local, configured (existing Nix routing), or nixbuild
    default: local
  nixbuild-token:
    description: nixbuild.net auth token supplied by the calling workflow secret
    default: ''
runs:
  using: composite
  steps:
    - name: Validate the selected backend
      shell: bash
      env:
        BACKEND: ${{ inputs.backend }}
        NIXBUILD_TOKEN: ${{ inputs.nixbuild-token }}
      run: |
        set -eu
        case "$BACKEND" in
          local|configured) ;;
          nixbuild) test -n "$NIXBUILD_TOKEN" || { echo '::error::nixbuild backend requires NIXBUILD_TOKEN'; exit 64; } ;;
          *) echo '::error::Unknown Nix backend; choose local, configured, or nixbuild'; exit 64 ;;
        esac
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          ${{ inputs.backend == 'local' && 'max-jobs = 1' || '' }}
          ${{ inputs.backend == 'nixbuild' && 'max-jobs = 0' || '' }}
          ${{ inputs.backend == 'local' && 'cores = 4' || '' }}
          ${{ inputs.backend == 'local' && 'extra-system-features = kvm' || '' }}
          ${{ inputs.backend == 'local' && 'extra-sandbox-paths = /dev/kvm' || '' }}
    - name: Configure nixbuild.net
      if: inputs.backend == 'nixbuild'
      uses: nixbuild/nixbuild-action@ccd11ee76c26c018e8470835dc2e286a5a024a14 # v27
      with:
        nixbuild_token: ${{ inputs.nixbuild-token }}
    - name: Enable the host qualifier user manager
      shell: bash
      run: |
        set -eu
        uid=$(id -u)
        sudo loginctl enable-linger "$USER"
        sudo systemctl start "user@$uid.service"
        echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
        echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends sqlite3 ripgrep
    - name: Verify local KVM access
      if: inputs.backend == 'local'
      shell: bash
      run: |
        set -eu
        test -c /dev/kvm || { echo "::error::The local bounded Nix backend requires /dev/kvm"; exit 69; }
        sudo apt-get install -y --no-install-recommends acl
        sudo setfacl -m g:nixbld:rw /dev/kvm
        build_gid=$(getent group nixbld | cut -d: -f3)
        build_user=$(getent passwd | awk -F: -v gid="$build_gid" '$4 == gid {print $1; exit}')
        test -n "$build_user"
        sudo -u "$build_user" python3 -c 'import fcntl, os; fd=os.open("/dev/kvm", os.O_RDWR); assert fcntl.ioctl(fd, 0xAE00, 0)==12; vm=fcntl.ioctl(fd, 0xAE01, 0); os.close(vm); os.close(fd)'

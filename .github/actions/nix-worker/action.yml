name: Configure the bounded worker host
description: Apply backend policy and provision host qualification capabilities
inputs:
  description:
    description: Source-owned backend description
    default: tooling/build-backends/local.bl
  nixbuild-token:
    description: Optional provider credential
    default: ''
runs:
  using: composite
  steps:
    - uses: ./.github/actions/nix-backend
      id: backend
      with:
        description: ${{ inputs.description }}
        nixbuild-token: ${{ inputs.nixbuild-token }}
    - name: Enable the host qualifier user manager
      shell: bash
      run: |
        set -eu
        uid=$(id -u)
        sudo loginctl enable-linger "$USER"
        sudo systemctl start "user@$uid.service"
        echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
        echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends sqlite3 ripgrep
    - name: Enable and verify qualifier user namespaces
      shell: bash
      run: |
        set -eu
        # The pinned FHS adapter uses bubblewrap with the real host PID and
        # cgroup identity. Ubuntu's default AppArmor restriction also applies
        # to executables in the Nix store, outside its distribution profiles.
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
          sudo sysctl -w kernel.unprivileged_userns_clone=1
        fi
        unshare --user --map-root-user true || {
          echo "::error::The host qualifier requires unprivileged user namespaces"
          exit 69
        }
    - name: Verify local KVM access
      if: steps.backend.outputs.backend == 'local'
      shell: bash
      run: |
        set -eu
        test -c /dev/kvm || { echo "::error::The local bounded Nix backend requires /dev/kvm"; exit 69; }
        sudo apt-get install -y --no-install-recommends acl
        sudo setfacl -m g:nixbld:rw /dev/kvm
        build_gid=$(getent group nixbld | cut -d: -f3)
        build_user=$(getent passwd | awk -F: -v gid="$build_gid" '$4 == gid {print $1; exit}')
        test -n "$build_user"
        sudo -u "$build_user" python3 -c 'import fcntl, os; fd=os.open("/dev/kvm", os.O_RDWR); assert fcntl.ioctl(fd, 0xAE00, 0)==12; vm=fcntl.ioctl(fd, 0xAE01, 0); os.close(vm); os.close(fd)'

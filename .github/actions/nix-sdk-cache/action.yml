name: Retain the Nix SDK and completed units
description: Free Actions cache for the Nix closure and verified predecessor selection
inputs:
  operation:
    description: restore before preparation, save only after SDK qualification
    default: restore
  key:
    description: Exact producer key for consumers; omit to restore a predecessor
    default: ''
  required:
    description: Fail on an exact cache miss instead of starting a second producer
    default: 'false'
  sdk:
    description: Qualified SDK to save, or exact producer SDK expected on restore
    default: ''
outputs:
  key:
    description: Key to save or hand to consumers
    value: ${{ steps.identity.outputs.key }}
  sdk:
    description: Validated retained immutable SDK, empty for a cold producer
    value: ${{ steps.selection.outputs.sdk }}
runs:
  using: composite
  steps:
    - name: Shared cache identity
      id: identity
      shell: bash
      env:
        EXPLICIT_KEY: ${{ inputs.key }}
        CACHE_PREFIX: enchant-nix-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
      run: |
        set -eu
        key=${EXPLICIT_KEY:-$CACHE_PREFIX${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}}
        printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"
        printf 'prefix=%s\n' "$CACHE_PREFIX" >> "$GITHUB_OUTPUT"
    - name: Restore registered Nix products and addressed dependency bytes
      if: inputs.operation == 'restore'
      id: nix-cache
      uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: ${{ steps.identity.outputs.key }}
        restore-prefixes-first-match: ${{ inputs.key == '' && steps.identity.outputs.prefix || '' }}
        # v7's actual parser accepts "primary", despite its action.yml docs
        # spelling "primary-key". The output check below also catches a
        # located cache whose download/restore did not complete.
        fail-on: ${{ inputs.required == 'true' && 'primary.miss' || '' }}
        save: 'false'
        paths: |
          ~/.cache/enchant-ci
          ~/.cache/beam_lisp
    - name: Require the exact producer cache for qualification consumers
      if: inputs.operation == 'restore' && inputs.required == 'true'
      shell: bash
      env:
        REQUESTED_KEY: ${{ steps.identity.outputs.key }}
        RESTORED_KEY: ${{ steps.nix-cache.outputs.restored-key }}
        PRIMARY_HIT: ${{ steps.nix-cache.outputs.hit-primary-key }}
      run: |
        if [ "$RESTORED_KEY" != "$REQUESTED_KEY" ] || [ "$PRIMARY_HIT" != true ]; then
          echo "::error::The exact qualified producer cache was not restored; rerun production"
          exit 69
        fi
    - name: Verify the selection and recreate only immutable checkout links
      id: selection
      shell: bash
      env:
        OPERATION: ${{ inputs.operation }}
        SDK: ${{ inputs.sdk }}
        REQUIRED: ${{ inputs.required }}
      run: |
        set -eu
        args=("$OPERATION")
        if [ -n "$SDK" ]; then args+=(--sdk "$SDK"); fi
        if [ "$REQUIRED" = true ]; then args+=(--required); fi
        sdk=$(python3 scripts/ci-sdk-cache.py "${args[@]}")
        printf 'sdk=%s\n' "$sdk" >> "$GITHUB_OUTPUT"
        python3 scripts/ci-model-input.py restore
    # Nix's DB/store are merged by this action, unlike a tar of /nix. Keep the
    # selection rooted through GC; never archive job handles or loose NIFs.
    - name: Save the qualified predecessor and bounded Nix store
      if: inputs.operation == 'save'
      uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: ${{ steps.identity.outputs.key }}
        paths: |
          ~/.cache/enchant-ci
          ~/.cache/beam_lisp
        gc-max-store-size: 8G

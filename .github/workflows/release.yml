name: release

# Only x86_64-linux has a qualified production path. The inventory and
# publication gates consume the producer's exact SDK/drop, never a new build.

on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Release provenance label (does not rebuild or restamp the compiler)"
        required: false
        default: ""

# Superseded branch candidates are disposable. Tagged releases are allowed
# to finish, and have a separate concurrency group from main/dispatch builds.
concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write
  actions: read

env:
  RELEASE_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  resolve-runtime:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      runtime_run: ${{ steps.qualified.outputs.runtime_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REVISION }}
      - name: Resolve fully successful main CI for this exact commit
        id: qualified
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || '' }}
        run: |
          args=(--revision "$RELEASE_REVISION" --github-output "$GITHUB_OUTPUT")
          if [ -n "$EVENT_RUN" ]; then args+=(--run-id "$EVENT_RUN"); fi
          python3 scripts/resolve-ci-runtime.py "${args[@]}"

  # One stable production SDK and one portable candidate for all consumers.
  linux:
    needs: resolve-runtime
    uses: ./.github/workflows/build-drop.yml
    with:
      artifact: linux-x86_64
      version: ${{ inputs.version || '' }}
      revision: ${{ github.event.workflow_run.head_sha || github.sha }}
      runtime_run: ${{ needs.resolve-runtime.outputs.runtime_run }}

  linux-inventory:
    # Only a fully successful exact main CI run permits inventory reuse.
    if: needs.resolve-runtime.outputs.runtime_run == ''
    needs: [resolve-runtime, linux]
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REVISION }}
      - uses: ./.github/actions/nix-worker
      - name: Restore the producer's exact registered SDK
        uses: ./.github/actions/nix-sdk-cache
        with:
          key: ${{ needs.linux.outputs.cache-key }}
          required: 'true'
          sdk: ${{ needs.linux.outputs.sdk }}
      # The bounded worker supplies the pinned FHS loader/libraries and derives
      # the candidate from this SDK. Host Ubuntu's libc is never substituted.
      - name: Run the complete inventory partition without SDK production
        env:
          QUALIFIED_SDK: ${{ needs.linux.outputs.sdk }}
        run: |
          scripts/ci-check --local --sdk "$QUALIFIED_SDK" \
            --models "$HOME/.cache/enchant-ci/models-root" \
            --shard ${{ matrix.shard }} --shards 4 \
            --out "$RUNNER_TEMP/release-results-${{ matrix.shard }}"
      - name: Retain exact per-file receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/release-results-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 7

  linux-native-inventory:
    if: needs.resolve-runtime.outputs.runtime_run == ''
    needs: [resolve-runtime, linux]
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REVISION }}
      - uses: ./.github/actions/nix-worker
      - name: Restore the same SDK for real Nix producer tests
        id: sdk-cache
        uses: ./.github/actions/nix-sdk-cache
        with:
          key: ${{ needs.linux.outputs.cache-key }}
          sdk: ${{ needs.linux.outputs.sdk }}
          required: 'true'
      - name: Prepare the pinned host qualifier adapter
        run: nix-build nix/ci-release-runtime.nix --out-link .bl/ci-release-runtime
      - name: Run declared real Nix consumers serially under their host cap
        run: |
          scripts/ci-host-nix-check --local --sdk '${{ steps.sdk-cache.outputs.sdk }}' \
            --models "$HOME/.cache/enchant-ci/models-root" --out "$RUNNER_TEMP/release-host-nix"
      - name: Retain host qualification receipts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-results-host-nix
          path: ${{ runner.temp }}/release-host-nix/
          if-no-files-found: error
          retention-days: 7

  publish-latest:
    name: publish latest (rolling)
    if: always() && github.event_name == 'workflow_run' && needs.resolve-runtime.result == 'success' && needs.resolve-runtime.outputs.runtime_run != '' && needs.linux.result == 'success' && needs.linux-inventory.result == 'skipped' && needs.linux-native-inventory.result == 'skipped'
    needs: [resolve-runtime, linux, linux-inventory, linux-native-inventory]
    runs-on: blacksmith-4vcpu-ubuntu-2604
    # One `latest` at a time: a newer push supersedes an older one mid-upload.
    concurrency:
      group: publish-latest
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REVISION }}
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 2
      - name: Prepare the pinned FHS publication check adapter
        run: nix-build nix/ci-release-runtime.nix --out-link .bl/ci-release-runtime
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: bl-*

      - name: Verify the exact Linux drop under its qualified pinned runtime
        shell: bash
        run: |
          ./scripts/with-release-runtime -- bash --noprofile --norc -e -o pipefail <<'BL_PINNED_RELEASE_CHECK'
          set -eu
          (cd dist && sha256sum -c bl-linux-x86_64.sha256)
          python3 scripts/release-requirements.py verify \
            --candidate dist/bl-linux-x86_64 --receipt dist/bl-linux-x86_64.requirements.json \
            --revision "$RELEASE_REVISION"
          chmod +x dist/bl-linux-x86_64
          ./dist/bl-linux-x86_64 --cold version

          BL_PINNED_RELEASE_CHECK
      # The tag `latest` MOVES to this commit and the release's assets are
      # replaced. `bl self-update latest` reads it by tag, verifies each asset
      # against its `.sha256`, and stores it once per digest.
      - name: Move the latest tag and replace its assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          current_head=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          if [ "$current_head" != "$RELEASE_REVISION" ]; then
            echo "Qualified commit $RELEASE_REVISION is superseded by main $current_head; retaining latest"
            exit 0
          fi
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/latest" -f sha="$RELEASE_REVISION" -F force=false \
            || gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref=refs/tags/latest -f sha="$RELEASE_REVISION"
          notes="Rolling build of main at ${RELEASE_REVISION:0:8}. Linux x86_64 only; glibc >= $(python3 -c 'import json; print(json.load(open("dist/bl-linux-x86_64.requirements.json"))["minimum_glibc"])'). Application version stays stable to reuse compiled SDK units; the requirements receipt identifies this commit and exact binary. Replaced on every push to main; for a fixed version use a vX.Y release."
          if gh release view latest -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit latest -R "${{ github.repository }}" --prerelease --title "latest (main ${RELEASE_REVISION:0:8})" --notes "$notes"
          else
            gh release create latest -R "${{ github.repository }}" --prerelease --title "latest (main ${RELEASE_REVISION:0:8})" --notes "$notes"
          fi
          gh release upload latest dist/* -R "${{ github.repository }}" --clobber

  publish:
    name: publish release
    if: >-
      always() && github.ref_type == 'tag' && needs.resolve-runtime.result == 'success' && needs.linux.result == 'success' &&
      ((needs.resolve-runtime.outputs.runtime_run != '' && needs.linux-inventory.result == 'skipped' && needs.linux-native-inventory.result == 'skipped') ||
      (needs.resolve-runtime.outputs.runtime_run == '' && needs.linux-inventory.result == 'success' && needs.linux-native-inventory.result == 'success'))
    needs: [resolve-runtime, linux, linux-inventory, linux-native-inventory]
    runs-on: blacksmith-4vcpu-ubuntu-2604
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REVISION }}
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 2
      - name: Prepare the pinned FHS publication check adapter
        run: nix-build nix/ci-release-runtime.nix --out-link .bl/ci-release-runtime
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: bl-*

      - name: Verify the exact Linux drop under its qualified pinned runtime
        shell: bash
        run: |
          ./scripts/with-release-runtime -- bash --noprofile --norc -e -o pipefail <<'BL_PINNED_RELEASE_CHECK'
          set -eu
          ls -la dist
          (cd dist && sha256sum -c bl-linux-x86_64.sha256)
          python3 scripts/release-requirements.py verify \
            --candidate dist/bl-linux-x86_64 --receipt dist/bl-linux-x86_64.requirements.json \
            --revision "$RELEASE_REVISION"
          chmod +x dist/bl-linux-x86_64
          ./dist/bl-linux-x86_64 --cold version
          ./dist/bl-linux-x86_64 --cold eval '(+ 1 2)'

          BL_PINNED_RELEASE_CHECK
      - name: Require the tagged release changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test -s "docs/changelog/$RELEASE_TAG.md"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: docs/changelog/${{ github.ref_name }}.md

name: build and qualify one native drop

on:
  workflow_call:
    inputs:
      artifact:
        required: true
        type: string
      runner:
        required: true
        type: string
      version:
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.artifact }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Require a supported Nix production target
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then
            echo "::error::The qualified Nix SDK producer currently supports x86_64-linux only"
            exit 69
          fi

      - name: Enable the bounded Nix preparation worker
        if: runner.os == 'Linux'
        run: |
          set -eu
          uid=$(id -u)
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$uid.service"
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"

      - uses: cachix/install-nix-action@v31
        if: runner.os == 'Linux'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 2
            extra-system-features = kvm
            extra-sandbox-paths = /dev/kvm

      - name: Verify bounded Nix workers can access KVM
        if: runner.os == 'Linux'
        run: |
          set -eu
          test -c /dev/kvm || { echo "::error::The bounded Nix backend requires /dev/kvm"; exit 69; }
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends acl
          sudo setfacl -m g:nixbld:rw /dev/kvm
          build_gid=$(getent group nixbld | cut -d: -f3)
          build_user=$(getent passwd | awk -F: -v gid="$build_gid" '$4 == gid {print $1; exit}')
          test -n "$build_user"
          sudo -u "$build_user" python3 -c 'import fcntl, os; fd=os.open("/dev/kvm", os.O_RDWR); assert fcntl.ioctl(fd, 0xAE00, 0)==12; vm=fcntl.ioctl(fd, 0xAE01, 0); os.close(vm); os.close(fd)'

      - name: Set up OTP 29 + Elixir 1.20
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.1"
          elixir-version: "1.20.4"

      - name: Resolve version
        id: version
        run: |
          set -eu
          v="${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}"
          v="${v#v}"
          [ -n "$v" ] || v="0.1.0-dev"
          # A push to main is `latest`: a prerelease of the next version, named
          # by its commit, so `bl version` says which main it is.
          if [ "${{ github.ref_type }}" = branch ] && [ -z "${{ inputs.version }}" ]; then
            v="0.1.0-latest.${GITHUB_SHA:0:8}"
          fi
          # Elixir's Version is major.minor.patch, so a CalVer tag like `v2026.0`
          # is stamped as `2026.0.0`. The GitHub release keeps the tag's name;
          # only the app version (what `bl version` reports) is normalized.
          case "$v" in
            *.*.*) ;;
            *.*) v="$v.0" ;;
            *)   v="$v.0.0" ;;
          esac
          echo "BL_VERSION=$v" >> "$GITHUB_ENV"
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "building beam-lisp $v for ${{ inputs.artifact }} (ref ${{ github.ref_name }})"

      - name: Restore addressed test assets
        uses: actions/cache@v4
        with:
          path: ~/.cache/beam_lisp
          key: ${{ inputs.artifact }}-test-assets-${{ hashFiles('bl.lock') }}
          restore-keys: |
            ${{ inputs.artifact }}-test-assets-

      # The version lives in the DECLARATION (env.bl `:app :vsn`) — that is what
      # the app resource is written from, and the app resource is what the
      # release assembly reads — so the release stamps it there instead of
      # passing it through a build tool's environment. Both occurrences: the
      # application's own vsn and the release's.
      - name: Stamp the version into env.bl
        run: |
          set -eu
          perl -pi -e "s/:vsn \"0\.1\.0\"/:vsn \"$BL_VERSION\"/" env.bl
          grep -n ':vsn' env.bl

      - name: Install runtime fixture prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0t64 libwebkit2gtk-4.1-0 libgtk-layer-shell0 tesseract-ocr inotify-tools

      # Public self-build publishes the selected Nix release. Its normal recipe
      # already produces dependencies, natives, floor, solver and stock launcher.
      - name: Build the drop through the normal Nix SDK path
        run: ./bin/bl --cold self-build --out "bl-${{ inputs.artifact }}"
      - name: Materialize the exact portable candidate for native fixtures
        run: |
          python3 scripts/ci-materialize-candidate.py \
            --sdk .bl/sdks/current-sdk --candidate "bl-${{ inputs.artifact }}"
      - name: Verify persistent SDK builds restore without initialization
        run: |
          python3 test/scripts/sdk_build_persistence.py --image .bl/ci-image
          python3 test/scripts/file_locks.py --image .bl/ci-image
          python3 test/scripts/owned_monitor.py --image .bl/ci-image
      - name: Fetch pinned embeddings for the complete Linux inventory
        if: inputs.artifact == 'linux-x86_64'
        run: ./bl-${{ inputs.artifact }} --cold install embed
      - name: Package the already-built Linux runtime for inventory consumers
        if: inputs.artifact == 'linux-x86_64'
        run: python3 scripts/package-ci-runtime.py --out "$RUNNER_TEMP" --candidate "bl-${{ inputs.artifact }}"
      - name: Retain the exact Linux runtime projection
        if: inputs.artifact == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-runtime
          path: |
            ${{ runner.temp }}/ci-runtime.tar.gz
            ${{ runner.temp }}/ci-store.tar.gz
          compression-level: 0
          retention-days: 1

      - name: Verify fresh SDK startup uses compiled units
        run: python3 test/scripts/drop_startup.py "bl-${{ inputs.artifact }}" --samples 1 --runtime-regressions

      # A drop gets launched in parallel more often than it looks — an editor
      # opening two workspaces, `bl realm start` beside a `bl run`, two jobs
      # on one machine. The first launch of a version extracts ~100 MB, and
      # that staging path used to be shared and deterministic: racers deleted
      # each other's work mid-unpack ("first-run extraction failed: failed to
      # unpack … into …/drop/<sha8>.tmp/…"). This step is that wave, on a
      # runner whose install dir is EMPTY — it must run before the smoke
      # below, because that one extracts this same payload and would leave the
      # directory warm.
      - name: Smoke test (concurrent first launch)
        run: |
          set -eu
          cp "bl-${{ inputs.artifact }}" "$RUNNER_TEMP/bl-race"
          chmod +x "$RUNNER_TEMP/bl-race"
          cd "$RUNNER_TEMP"
          pids=""
          for i in 1 2 3 4 5 6 7 8; do
            ( ./bl-race --cold version >"race-$i.out" 2>&1 ) &
            pids="$pids $!"
          done
          fail=0
          for p in $pids; do wait "$p" || fail=1; done
          for i in 1 2 3 4 5 6 7 8; do
            echo "race-$i: $(cat "race-$i.out")"
            grep -q "beam-lisp " "race-$i.out" || fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "FAIL: a concurrent first launch did not answer" >&2
            exit 1
          fi

      # The drop must run with NO warm VM and NO checkout: this is the artifact
      # a user downloads, exercised exactly as they would. It is copied out of
      # the workspace first, so a namespace that the payload is missing cannot
      # be papered over by the checkout's own sources. Every assertion is a
      # live native surface — the language, a Rust NIF (fjall), the core
      # lazy_memo runtime, Explorer/Polars, and the z3 port — so a payload that
      # silently lost its native tier fails here rather than on a user's machine.
      - name: Smoke test (cold, no warm VM, no checkout)
        run: |
          set -eu
          cp "bl-${{ inputs.artifact }}" "$RUNNER_TEMP/bl"
          chmod +x "$RUNNER_TEMP/bl"
          cd "$RUNNER_TEMP"
          BL="./bl"
          expect() {
            got="$("$BL" --cold eval "$3" 2>&1 | tail -n1)"
            if [ "$got" != "$2" ]; then
              echo "FAIL $1: expected '$2', got '$got'" >&2
              exit 1
            fi
            echo "ok  $1 → $got"
          }
          got="$("$BL" --cold version --short | tail -n1)"
          if [ "$got" != "beam-lisp $BL_VERSION" ]; then
            echo "FAIL version: expected 'beam-lisp $BL_VERSION', got '$got'" >&2
            exit 1
          fi
          echo "ok  version → $got"
          expect language   3      '(+ 1 2)'
          expect datom_fjall true  '(datom.store-fjall/available?)'
          expect explorer   true   '(datom.frame/available?)'
          expect lazy_memo  65536  '(BeamLisp.LazyMemo/fast_lane_bytes)'

          # The oracle answers a STATUS MAP on the oracle tier and a bare string
          # on the older port. This check used to demand the string and so failed
          # a release whose solver was working — observed on all four targets:
          #
          #     FAIL z3: expected 'sat', got '{:status :sat, :core [], :why nil,
          #     :tier :oracle, :model {}, …}'
          #
          # `bl doctor` already learned this (its probe reads whichever shape is
          # there, with the measurement written down). Ask for the status and
          # accept both, so a shape change cannot fail a build again.
          z3_out="$("$BL" --cold eval '(let [p (z3/open) r (z3/check p "(assert true)")] (or (:status r) r))' 2>&1 | tail -n1)"
          case "$z3_out" in
            *sat*) echo "ok  z3 → $z3_out" ;;
            *) echo "FAIL z3: expected a status naming sat, got '$z3_out'" >&2; exit 1 ;;
          esac

          # The two stdio servers, from a cwd that has no beam-lisp sources in
          # it at all — which is the point: everything they need comes from the
          # installed priv tier. `bl mcp` mounts a codebase, and a mount that
          # resolved "priv/std/codebase.bl" against the cwd answered nothing
          # here (the reader got `:enoent` as source text) while working fine
          # from a checkout.
          mcp_req='{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"code/list","arguments":{}},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28"}}'
          got="$(printf '%s\n' "$mcp_req" | "$BL" --cold mcp 2>/dev/null | head -n1)"
          case "$got" in
            *'"codebases"'*'"functions":'*)
              echo "ok  mcp → served a mounted codebase" ;;
            *)
              echo "FAIL mcp: expected a code/list result, got '$got'" >&2; exit 1 ;;
          esac

          lsp_body='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"capabilities":{}}}'
          got="$(printf 'Content-Length: %s\r\n\r\n%s' "${#lsp_body}" "$lsp_body" \
                 | "$BL" --cold lsp serve 2>/dev/null | head -c 200)"
          case "$got" in
            *'"capabilities"'*)
              echo "ok  lsp serve → answered initialize" ;;
            *)
              echo "FAIL lsp serve: expected an initialize result, got '$got'" >&2; exit 1 ;;
          esac

      - name: Checksum
        run: |
          set -eu
          f="bl-${{ inputs.artifact }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$f" > "$f.sha256"
          else
            shasum -a 256 "$f" > "$f.sha256"
          fi
          cat "$f.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: bl-${{ inputs.artifact }}
          path: |
            bl-${{ inputs.artifact }}
            bl-${{ inputs.artifact }}.sha256
          # The payload is already gzip; re-zipping ~100 MB per leg buys nothing.
          compression-level: 0
          retention-days: 7


name: SDK transfer
on:
  workflow_dispatch:
    inputs:
      source_run:
        type: string
        required: true
      revision:
        type: string
        required: true
      known_paths:
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 15
    steps:
      - name: Validate the addressed producer
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          SOURCE_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os,re
          assert os.environ['GITHUB_REPOSITORY'] == 'undefine-org/enchant'
          assert re.fullmatch(r'[0-9]+',os.environ['SOURCE_RUN'])
          assert re.fullmatch(r'[0-9a-f]{40}',os.environ['SOURCE_REVISION'])
          PYTHON
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/producer-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > "$RUNNER_TEMP/producer-jobs.json"
          python3 - <<'PYTHON'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          run=json.loads((root/'producer-run.json').read_text())
          assert run['head_sha']==os.environ['SOURCE_REVISION']
          assert run['head_branch']=='main' and run['event']=='push'
          assert run['path']=='.github/workflows/ci.yml'
          jobs=json.loads((root/'producer-jobs.json').read_text())['jobs']
          assert any(j['name']=='prepare-linux' and j['status']=='completed' and j['conclusion']=='success' for j in jobs)
          PYTHON
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/download-artifact@v4
        with:
          name: ci-sdk-selection
          path: ${{ runner.temp }}/selection
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
      - name: Read the authenticated producer selection
        id: selection
        env:
          SOURCE_RUN: ${{ inputs.source_run }}
          SOURCE_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          python3 scripts/ci-sdk-cache.py read-selector --selector "$RUNNER_TEMP/selection/ci-sdk-selection.json" \
            --revision "$SOURCE_REVISION" --run-id "$SOURCE_RUN" --github-output
      - uses: ./.github/actions/nix-worker
      - uses: ./.github/actions/nix-sdk-cache
        with:
          key: ${{ steps.selection.outputs.key }}
          sdk: ${{ steps.selection.outputs.sdk }}
          required: 'true'
      - name: Verify and export existing registered paths
        env:
          SOURCE_RUN: ${{ inputs.source_run }}
          SOURCE_REVISION: ${{ inputs.revision }}
          KNOWN_PATHS: ${{ inputs.known_paths }}
        run: |
          set -euo pipefail
          python3 scripts/ci-sdk-cache.py verify-selector --selector "$RUNNER_TEMP/selection/ci-sdk-selection.json" \
            --revision "$SOURCE_REVISION" --run-id "$SOURCE_RUN"
          python3 - <<'PYTHON'
          import hashlib,json,os,pathlib,re,subprocess
          selector=pathlib.Path(os.environ['RUNNER_TEMP'])/'selection/ci-sdk-selection.json'
          record=json.loads(selector.read_text())
          known=set(filter(None,os.environ['KNOWN_PATHS'].splitlines()))
          assert all(re.fullmatch(r'/nix/store/[0-9a-z]{32}-[^/\s]+',p) for p in known)
          closure=set(subprocess.check_output(['nix-store','--query','--requisites',record['sdk']],text=True).splitlines())
          assert record['sdk'] in closure
          missing=sorted(closure-known)
          assert missing and all(re.fullmatch(r'/nix/store/[0-9a-z]{32}-[^/\s]+',p) for p in missing)
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'sdk-transfer';out.mkdir()
          archive=out/'sdk-paths.nar.zst'
          exporter=subprocess.Popen(['nix-store','--export',*missing],stdout=subprocess.PIPE)
          try:
              subprocess.run(['zstd','-T2','-3','-o',str(archive)],stdin=exporter.stdout,check=True)
          finally:
              exporter.stdout.close()
          assert exporter.wait()==0
          with archive.open('rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
          metadata={'version':1,'kind':'ci-sdk-transfer','producer':record,
                    'archive_sha256':digest,'known_paths_sha256':hashlib.sha256(('\n'.join(sorted(known))+'\n').encode()).hexdigest(),
                    'closure':sorted(closure),'exported':missing,'sdk_production_requested':False}
          (out/'transfer.json').write_text(json.dumps(metadata,indent=2)+'\n')
          print(json.dumps({'exported_paths':len(missing),'known_closure_paths':len(closure&known),'compressed_bytes':archive.stat().st_size,'sdk':record['sdk'],'sdk_production_requested':False}))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-transfer-${{ inputs.source_run }}
          path: ${{ runner.temp }}/sdk-transfer/
          compression-level: 0
          retention-days: 1
